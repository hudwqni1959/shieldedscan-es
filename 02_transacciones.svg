<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07191e"/><stop offset="1" stop-color="#1b2442"/></linearGradient></defs><rect x="0" y="0" width="1200" height="1500" rx="20" fill="url(#bg)" stroke="none" stroke-width="2"/><rect x="52" y="52" width="1096" height="1396" rx="30" fill="none" stroke="#3d6267" stroke-width="2"/><text x="96" y="125" font-family="Arial" font-size="35" font-weight="700" fill="#63efbb" text-anchor="start">./shieldedscan</text><text x="1084" y="125" font-family="Arial" font-size="28" font-weight="700" fill="#92b6b5" text-anchor="end">02 / 04</text><path d="M96 160H1104 M96 1380H1104" stroke="#3d6267" stroke-width="2"/><text x="96" y="240" font-family="Arial" font-size="24" font-weight="700" fill="#63efbb" text-anchor="start">LEE LAS TRANSACCIONES</text><text x="96" y="330" font-family="Arial" font-size="68" font-weight="700" fill="#f0faf9" text-anchor="start">¿Qué se puede</text><text x="96" y="410" font-family="Arial" font-size="68" font-weight="700" fill="#f0faf9" text-anchor="start">ver?</text><text x="96" y="485" font-family="Arial" font-size="31" font-weight="400" fill="#bdd0d0" text-anchor="start">El tipo de transacción define qué datos</text><text x="96" y="530" font-family="Arial" font-size="31" font-weight="400" fill="#bdd0d0" text-anchor="start">son públicos y cuáles quedan protegidos.</text><rect x="100" y="590" width="1000" height="185" rx="20" fill="#12393d" stroke="#397467" stroke-width="2"/><rect x="100" y="800" width="1000" height="185" rx="20" fill="#182f49" stroke="#526d8a" stroke-width="2"/><rect x="100" y="1010" width="1000" height="210" rx="20" fill="#262a47" stroke="#6e6691" stroke-width="2"/><text x="148" y="650" font-family="Arial" font-size="32" font-weight="700" fill="#67eac0" text-anchor="start">TRANSPARENTE</text><text x="148" y="705" font-family="Arial" font-size="30" font-weight="400" fill="#eafaf5" text-anchor="start">Direcciones e importe visibles públicamente.</text><text x="148" y="860" font-family="Arial" font-size="32" font-weight="700" fill="#9bcafa" text-anchor="start">MIXTA</text><text x="148" y="915" font-family="Arial" font-size="30" font-weight="400" fill="#eafaf5" text-anchor="start">La parte transparente sigue siendo visible.</text><text x="148" y="1070" font-family="Arial" font-size="32" font-weight="700" fill="#c0afff" text-anchor="start">BLINDADA</text><text x="148" y="1125" font-family="Arial" font-size="30" font-weight="400" fill="#eafaf5" text-anchor="start">La cadena verifica que ocurrió;</text><text x="148" y="1170" font-family="Arial" font-size="30" font-weight="400" fill="#eafaf5" text-anchor="start">no revela los detalles blindados.</text><text x="100" y="1290" font-family="Arial" font-size="25" font-weight="400" fill="#a9c5c5" text-anchor="start">Una búsqueda no descifra un pago blindado.</text><text x="96" y="1420" font-family="Arial" font-size="20" font-weight="700" fill="#88aeb2" text-anchor="start">FUENTES: SHIELDEDSCAN.XYZ · ZCASH DOCUMENTATION</text></svg>